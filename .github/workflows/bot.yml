name: music-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه یک جلسه‌ی جدید
  workflow_dispatch: {}      # دکمه‌ی اجرای دستی

permissions:
  contents: write            # برای ذخیره‌ی store.json (ماندگاری دکمه‌ها)

concurrency:
  group: music-bot           # هرگز دو نسخه همزمان اجرا نشود
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deno (yt-dlp stability)
        run: |
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh || true
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run bot session
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_SECONDS: "270"
        run: python run_session.py

      - name: Persist buttons store
        run: |
          git config user.name "muzikyab-bot"
          git config user.email "muzikyab-bot@users.noreply.github.com"
          git add store.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "store update" && git push || true
